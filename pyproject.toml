[project]
name = "volsurface"
version = "0.1.0"
description = "Implied volatility surface modelling and hedging on a newly listed mega-cap (SPCX) vs. a mature benchmark"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "pandas", "pyarrow", "yfinance", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest", "jupyter"]

[tool.setuptools.packages.find]
where = ["src"]
